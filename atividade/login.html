<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eletro Kurumin - Iniciar Sessão | Controlo de Stock</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-header">
      <div class="login-brand-icon">
        <!-- Ícone SVG de Chip Eletrónico / Circuito Integrado -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="16" rx="2"></rect>
          <rect x="9" y="9" width="6" height="6"></rect>
          <line x1="9" y1="1" x2="9" y2="4"></line>
          <line x1="15" y1="1" x2="15" y2="4"></line>
          <line x1="9" y1="20" x2="9" y2="23"></line>
          <line x1="15" y1="20" x2="15" y2="23"></line>
          <line x1="20" y1="9" x2="23" y2="9"></line>
          <line x1="20" y1="14" x2="23" y2="14"></line>
          <line x1="1" y1="9" x2="4" y2="9"></line>
          <line x1="1" y1="14" x2="4" y2="14"></line>
        </svg>
      </div>
      <h1>Eletro Kurumin</h1>
      <p>Sistema de Controlo de Stock de Componentes</p>
    </div>

    <!-- Mensagem de erro de autenticação -->
    <div id="login-alerta" style="display: none; padding: 0.75rem 1rem; margin-bottom: 1.25rem; border-radius: var(--radius-sm); font-size: 0.85rem; background-color: #fee2e2; border: 1px solid #fecaca; color: #991b1b;"></div>

    <form id="form-login" novalidate>
      <div class="form-group" style="margin-bottom: 1.15rem;">
        <label class="form-label" for="login-email">Endereço de E-mail</label>
        <input 
          type="email" 
          id="login-email" 
          class="form-input" 
          placeholder="exemplo@eletrokurumin.pt" 
          required 
          autocomplete="email"
          autofocus
        >
        <div id="email-erro" class="form-error"></div>
      </div>

      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label class="form-label" for="login-password">Palavra-passe</label>
        <input 
          type="password" 
          id="login-password" 
          class="form-input" 
          placeholder="••••••••••••" 
          required 
          autocomplete="current-password"
        >
        <div id="password-erro" class="form-error"></div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; font-size: 0.85rem;">
        <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; color: var(--color-text-muted);">
          <input type="checkbox" id="lembrar-sessao"> Manter sessão iniciada
        </label>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem; font-weight: 600;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        Iniciar Sessão
      </button>
    </form>

    <!-- Caixa com credenciais de demonstração pré-configuradas -->
    <div class="demo-credentials-box">
      <h4>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        Utilizador de Demonstração Pré-configurado:
      </h4>
      <ul>
        <li><strong>E-mail:</strong> <code>admin@eletrokurumin.pt</code></li>
        <li><strong>Palavra-passe:</strong> <code>kurumin2026</code></li>
        <li><strong>Perfil:</strong> Gestor de Armazém (Carlos Pereira)</li>
      </ul>
      <div style="margin-top: 0.75rem;">
        <button type="button" id="btn-preencher-demo" class="btn btn-secondary btn-sm" style="width: 100%;">
          ⚡ Preencher Automaticamente com Utilizador Demo
        </button>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // Redireciona se o utilizador já tiver sessão iniciada
    Auth.redirecionarSeAutenticado();

    const form = document.getElementById('form-login');
    const inputEmail = document.getElementById('login-email');
    const inputPassword = document.getElementById('login-password');
    const checkLembrar = document.getElementById('lembrar-sessao');
    const alerta = document.getElementById('login-alerta');
    const btnPreencherDemo = document.getElementById('btn-preencher-demo');

    // Botão auxiliar de demonstração
    btnPreencherDemo.addEventListener('click', () => {
      inputEmail.value = 'admin@eletrokurumin.pt';
      inputPassword.value = 'kurumin2026';
      alerta.style.display = 'none';
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      alerta.style.display = 'none';

      const email = inputEmail.value.trim();
      const password = inputPassword.value;

      if (!email || !password) {
        alerta.textContent = 'Por favor, preencha todos os campos obrigatórios.';
        alerta.style.display = 'block';
        return;
      }

      const resultado = Auth.iniciarSessao(email, password, checkLembrar.checked);

      if (resultado.sucesso) {
        // Redireciona para o painel principal de gestão de componentes
        window.location.href = 'index.html';
      } else {
        alerta.textContent = resultado.mensagem;
        alerta.style.display = 'block';
      }
    });
  </script>
</body>
</html>
